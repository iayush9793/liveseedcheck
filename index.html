<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white antialiased">

  <!-- Metric Overview Cards -->

      <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3.5 shadow-xs">

    <!-- Filter Bar -->
    <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-xs flex flex-col sm:flex-row items-center justify-between gap-2.5">
      <div class="relative flex-1 w-full">
        <input
          id="search-input"
          type="text"
          placeholder="Search extracted domain (e.g. quantumhflow.co.in)..."
          class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />

      <div class="w-full sm:w-auto">
        <select id="filter-status" class="w-full sm:w-auto bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs text-slate-700 font-medium focus:outline-none">
          <option value="ALL">All Statuses</option>
          <option value="HAS_SPAM">⚠️ Spam Detected</option>
          <option value="ALL_INBOX">✓ 100% Inboxed (4/4)</option>

        </select>

    <!-- Domains List Container -->
    <div id="domains-container" class="space-y-3">

        Loading target domains from JSG 30 sheet...
      </div>
    </div>
  </main>

  <script>
    const OAUTH_CLIENT_ID = "707901165841-938emg3s0i65g4j1nebqqf33kr65rblp.apps.googleusercontent.com";
    const OAUTH_CLIENT_SECRET = "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";
    const JSG_30_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRDONkWXwJe5JfNjDzlkoMRHd3OM8qMSogUrxx0lqUJRHftHyUqrOyWVkgYbbEO6jDJRGK2wCzxFJVA/pub?gid=0&single=true&output=csv";

    const ACCOUNTS = [
      { id: "acc_1", name: "ashwindelaycheck", token: "1//0gufI0Kvut_L4CgYIARAAGBASNwF-L9IrCP4euif3CzkRhJnPmOiRCGAVFBisqIB1lyS8m_O6a8BwKA71fkbqQ90wnpn_HdLG-NA" },
      { id: "acc_2", name: "kartikdelaycheck", token: "1//0gG08sb6H3p89CgYIARAAGBASNwF-L9IrATWaA7E1Z7v1jdg0elGLrPSO4CA7sOtS3nCxoqhZQDK65EKJKdMXXV7gwVJQEas2HYw" },
      { id: "acc_3", name: "newnonop5", token: "1//0gnjgHv0wY6UlCgYIARAAGBASNwF-L9IrSBpsc4M9nYr6hfOwSNX8f9kIa1BhONy6iL5OfQTEvYsdRRsYUBM5w6h555fAlc63-7k" },
      { id: "acc_4", name: "ashwinkartiknonop1710", token: "1//0gIqfIxrmUeCyCgYIARAAGBASNwF-L9IrZtQJKhrc1ioUlyO95Lb2qyy98kAiNwsaboHBGXj1_kKqkWU7SN-kItXXB-ItUJ2PFe8" }
    ];

    let currentScope = 'TODAY'; // 'TODAY' or 'YESTERDAY'
    let sheetDomainsList = []; // List of { domain, dateStr, rawDomain } extracted from sheet for current scope
    let emailRecords = []; // Fetched emails from seeds
    let timerSeconds = 30;
    let timerInterval = null;
    let isSyncing = false;
    const tokenCache = {};

    // --- DATE PARSER & HELPERS ---
    function cleanDomain(val) {
      if (!val) return '';
      let str = String(val).trim().toLowerCase();
      // Handle email string (e.g. news@quantumhflow.co.in)
      if (str.includes('@')) {
        const parts = str.split('@');
        str = parts[parts.length - 1];
      }
      return str.replace(/[^a-z0-9.-]/g, '');
    }

    function parseRowDate(dateStr) {
      if (!dateStr) return null;
      const clean = dateStr.trim();
      let d, m, y;

      // Handle DD-MM-YYYY or DD/MM/YYYY or DD.MM.YYYY
      if (/^\d{1,2}[-/.]\d{1,2}[-/.]\d{4}$/.test(clean)) {
        const parts = clean.split(/[-/.]/);
        d = parseInt(parts[0], 10);
        m = parseInt(parts[1], 10) - 1;
        y = parseInt(parts[2], 10);
        return new Date(y, m, d);
      }
      // Handle YYYY-MM-DD or YYYY/MM/DD
      if (/^\d{4}[-/.]\d{1,2}[-/.]\d{1,2}$/.test(clean)) {
        const parts = clean.split(/[-/.]/);
        y = parseInt(parts[0], 10);
        m = parseInt(parts[1], 10) - 1;
        d = parseInt(parts[2], 10);
        return new Date(y, m, d);
      }
      const parsed = new Date(clean);
      return isNaN(parsed.getTime()) ? null : parsed;
    }

    function isDateMatchingTargetScope(dateStr, targetScope) {
      const rowDate = parseRowDate(dateStr);
      if (!rowDate) return false;

      const targetDate = new Date();
      if (targetScope === 'YESTERDAY') {
        targetDate.setDate(targetDate.getDate() - 1);
      }

      return (
        rowDate.getDate() === targetDate.getDate() &&
        rowDate.getMonth() === targetDate.getMonth() &&
        rowDate.getFullYear() === targetDate.getFullYear()
      );
    }

    // --- CSV SPLITTER ---
    function parseCsvLine(text) {
      const result = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          result.push(cur.trim().replace(/^"|"$/g, ''));
          cur = '';
        } else {
          cur += c;
        }
      }
      result.push(cur.trim().replace(/^"|"$/g, ''));
      return result;
    }

    // --- FETCH JSG 30 SHEET ---
    async function loadTargetDomainsFromSheet(scope) {
      try {
        const endpoints = [
          JSG_30_CSV_URL,
          `https://corsproxy.io/?url=${encodeURIComponent(JSG_30_CSV_URL)}`,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(JSG_30_CSV_URL)}`
        ];

        let rawCsv = '';
        for (const ep of endpoints) {
          try {
            const resp = await fetch(ep, { cache: 'no-store' });
            if (resp.ok) {
              const text = await resp.text();
              if (text && !text.includes('<!DOCTYPE html>') && text.length > 20) {
                rawCsv = text;
                break;
              }
            }
          } catch (e) {}
        }

        if (!rawCsv) return [];

        const lines = rawCsv.split(/\r?\n/).filter(l => l.trim().length > 0);
        if (lines.length < 2) return [];

        const headerCols = parseCsvLine(lines[0]).map(h => h.trim().toLowerCase());
        
        // Find "Domain" and "DATE" columns dynamically
        let domainIdx = headerCols.findIndex(h => h === 'domain' || h.includes('domain'));
        let dateIdx = headerCols.findIndex(h => h === 'date' || h.includes('date'));

        if (domainIdx === -1) domainIdx = 0;
        if (dateIdx === -1) dateIdx = 1;

        const results = [];
        const seen = new Set();

        for (let i = 1; i < lines.length; i++) {
          const cols = parseCsvLine(lines[i]);
          const rawDomainVal = (cols[domainIdx] || '').trim();
          const dateVal = (cols[dateIdx] || '').trim();
          const cleanDom = cleanDomain(rawDomainVal);

          if (cleanDom && isDateMatchingTargetScope(dateVal, scope)) {
            if (!seen.has(cleanDom)) {
              seen.add(cleanDom);
              results.push({
                domain: cleanDom,
                rawDomain: rawDomainVal,
                dateStr: dateVal
              });
            }
          }
        }
        return results;
      } catch (err) {
        console.error("Sheet loading error:", err);
        return [];
      }
    }

    // --- GMAIL REFRESH TOKEN ACCESS ---
    async function getAccessToken(acc) {
      const now = Date.now();
      if (tokenCache[acc.id] && tokenCache[acc.id].expiry > now + 60000) {
        return tokenCache[acc.id].token;
      }

      const bodyParams = new URLSearchParams({
        client_id: OAUTH_CLIENT_ID,
        client_secret: OAUTH_CLIENT_SECRET,
        refresh_token: acc.token,
        grant_type: 'refresh_token'
      });

      const endpoints = [
        'https://oauth2.googleapis.com/token',
        `https://corsproxy.io/?url=${encodeURIComponent('https://oauth2.googleapis.com/token')}`
      ];

      for (const ep of endpoints) {
        try {
          const resp = await fetch(ep, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: bodyParams.toString()
          });

          if (resp.ok) {
            const data = await resp.json();
            if (data.access_token) {
              tokenCache[acc.id] = {
                token: data.access_token,
                expiry: now + (data.expires_in || 3600) * 1000
              };
              return data.access_token;
            }
          }
        } catch (e) {}
      }
      return null;
    }

    function formatDateYMD(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}/${m}/${day}`;
    }

    // --- FETCH GMAIL EMAILS ---
    async function syncMailbox(acc, scope) {
      const token = await getAccessToken(acc);
      if (!token) return [];

      const now = new Date();
      let query = '';
      if (scope === 'YESTERDAY') {
        const twoDaysAgo = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 2);
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        query = `after:${formatDateYMD(twoDaysAgo)} before:${formatDateYMD(today)} (in:inbox OR in:spam)`;
      } else {
        const yesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
        query = `after:${formatDateYMD(yesterday)} (in:inbox OR in:spam)`;
      }

      try {
        const listUrl = `https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=100&includeSpamTrash=true&q=${encodeURIComponent(query)}`;
        let listResp = null;
        try {
          listResp = await fetch(listUrl, { headers: { Authorization: `Bearer ${token}` } });
        } catch {
          listResp = await fetch(`https://corsproxy.io/?url=${encodeURIComponent(listUrl)}`, { headers: { Authorization: `Bearer ${token}` } });
        }

        if (!listResp || !listResp.ok) return [];
        const listData = await listResp.json();
        const messages = listData.messages || [];

        const details = await Promise.all(messages.slice(0, 35).map(async (m) => {
          try {
            const dUrl = `https://gmail.googleapis.com/gmail/v1/users/me/messages/${m.id}?format=metadata&metadataHeaders=From&metadataHeaders=Subject`;
            let r = null;
            try {
              r = await fetch(dUrl, { headers: { Authorization: `Bearer ${token}` } });
            } catch {
              r = await fetch(`https://corsproxy.io/?url=${encodeURIComponent(dUrl)}`, { headers: { Authorization: `Bearer ${token}` } });
            }
            return r && r.ok ? await r.json() : null;
          } catch {
            return null;
          }
        }));

        const parsedRecords = [];
        details.forEach(msg => {
          if (!msg) return;
          const labels = msg.labelIds || [];
          const folder = labels.includes('SPAM') ? 'SPAM' : labels.includes('INBOX') ? 'INBOX' : 'OTHER';
          const fromHeader = msg.payload?.headers?.find(h => h.name.toLowerCase() === 'from')?.value || '';
          const subject = msg.payload?.headers?.find(h => h.name.toLowerCase() === 'subject')?.value || '(No Subject)';
          const dom = cleanDomain(fromHeader);

          parsedRecords.push({
            id: msg.id,
            accountName: acc.name,
            folder: folder,
            from: fromHeader,
            domain: dom,
            subject: subject
          });
        });
        return parsedRecords;
      } catch (err) {
        return [];
      }
    }

    // --- COMBINE SHEET DOMAINS & INBOX STATUS ---
    async function runMasterSync() {
      if (isSyncing) return;
      isSyncing = true;
      document.getElementById('sync-spinner').classList.add('animate-spin');

      // Step 1: Extract current/yesterday domains from JSG 30 Sheet
      sheetDomainsList = await loadTargetDomainsFromSheet(currentScope);
      document.getElementById('badge-sheet-status').textContent = `${sheetDomainsList.length} Domains Loaded (${currentScope})`;

      // Step 2: Fetch Seed Mailboxes
      const accResults = await Promise.all(ACCOUNTS.map(acc => syncMailbox(acc, currentScope)));
      emailRecords = accResults.flat();

      isSyncing = false;
      document.getElementById('sync-spinner').classList.remove('animate-spin');
      renderDashboard();
    }

    // --- RENDER DASHBOARD ---
    function renderDashboard() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      const statusFilter = document.getElementById('filter-status').value;
      const container = document.getElementById('domains-container');

      // Map email records by domain
      const emailDomainMap = new Map();
      emailRecords.forEach(em => {
        if (!em.domain) return;
        if (!emailDomainMap.has(em.domain)) {
          emailDomainMap.set(em.domain, []);
        }
        emailDomainMap.get(em.domain).push(em);
      });

      // Assemble card objects for each domain from sheet
      const cardsData = sheetDomainsList.map(item => {
        const receivedEmails = emailDomainMap.get(item.domain) || [];
        const inboxes = new Set();
        const spams = new Set();

        receivedEmails.forEach(em => {
          if (em.folder === 'INBOX') inboxes.add(em.accountName);
          if (em.folder === 'SPAM') spams.add(em.accountName);
        });

        return {
          domain: item.domain,
          rawDomain: item.rawDomain,
          dateStr: item.dateStr,
          inboxAccounts: Array.from(inboxes),
          spamAccounts: Array.from(spams),
          hasSpam: spams.size > 0,
          inboxCount: inboxes.size,
          emails: receivedEmails
        };
      });

      // Filter
      const filtered = cardsData.filter(c => {
        if (q && !c.domain.includes(q) && !c.rawDomain.toLowerCase().includes(q)) return false;
        if (statusFilter === 'HAS_SPAM' && !c.hasSpam) return false;
        if (statusFilter === 'ALL_INBOX' && c.inboxCount !== 4) return false;
        if (statusFilter === 'PARTIAL_INBOX' && (c.inboxCount === 0 || c.inboxCount === 4)) return false;
        if (statusFilter === 'NO_MAIL' && c.inboxCount !== 0) return false;
        return true;
      });

      // Stats
      document.getElementById('stat-total').textContent = sheetDomainsList.length;
      document.getElementById('stat-all-inbox').textContent = cardsData.filter(c => c.inboxCount === 4).length;
      document.getElementById('stat-partial-inbox').textContent = cardsData.filter(c => c.inboxCount >= 1 && c.inboxCount < 4).length;
      document.getElementById('stat-spam').textContent = cardsData.filter(c => c.hasSpam).length;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-xl p-10 text-center text-slate-500 text-xs">
            No matching domains found for <strong>${currentScope}</strong>.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(c => {
        let borderClass = 'border-slate-200';
        if (c.hasSpam) {
          borderClass = 'border-rose-300 ring-1 ring-rose-300/30';
        } else if (c.inboxCount === 4) {
          borderClass = 'border-emerald-300';
        }

        return `
          <div class="bg-white border ${borderClass} rounded-xl p-4 shadow-xs space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-2.5">
              <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg ${c.hasSpam ? 'bg-rose-100 text-rose-700' : 'bg-indigo-50 text-indigo-700'} flex items-center justify-center font-bold text-xs shrink-0">
                  ${c.hasSpam ? '⚠️' : '🌐'}
                </div>
                <div>
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="font-mono text-sm font-bold text-slate-900">${escapeHtml(c.domain)}</span>
                    <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-mono">${escapeHtml(c.dateStr)}</span>
                  </div>
                  <div class="text-[10px] text-slate-400 font-mono">From Heading: ${escapeHtml(c.rawDomain)}</div>
                </div>
              </div>

              <div class="flex items-center gap-2 self-start sm:self-auto">
                <span class="px-2.5 py-1 rounded-md text-xs font-bold ${c.inboxCount === 4 ? 'bg-emerald-100 text-emerald-800' : c.inboxCount > 0 ? 'bg-indigo-100 text-indigo-800' : 'bg-slate-100 text-slate-600'}">
                  ${c.inboxCount}/4 Inboxed
                </span>
                ${c.hasSpam ? `
                  <span class="px-2.5 py-1 rounded-md text-xs font-bold bg-rose-100 text-rose-700">
                    ${c.spamAccounts.length} Spam ACs
                  </span>
                ` : ''}
              </div>
            </div>

            <!-- Seed Accounts Status -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
              ${ACCOUNTS.map(acc => {
                const isInboxed = c.inboxAccounts.includes(acc.name);
                const isSpam = c.spamAccounts.includes(acc.name);

                let badge = 'bg-slate-50 text-slate-400 border-slate-200';
                let text = 'Pending (-)';

                if (isInboxed) {
                  badge = 'bg-emerald-50 text-emerald-700 border-emerald-300 font-bold';
                  text = 'INBOX ✓';
                } else if (isSpam) {
                  badge = 'bg-rose-50 text-rose-700 border-rose-300 font-bold';
                  text = 'SPAM ⚠️';
                }

                return `
                  <div class="p-2 rounded-lg border ${badge} text-[11px] flex items-center justify-between">
                    <span class="truncate font-medium">${acc.name}</span>
                    <span class="shrink-0 text-[10px]">${text}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // --- EVENT HANDLERS & 30s TIMER ---
    document.getElementById('btn-sync-now').addEventListener('click', () => {
      timerSeconds = 30;
      runMasterSync();
    });

    document.getElementById('btn-toggle-scope').addEventListener('click', () => {
      if (currentScope === 'TODAY') {
        currentScope = 'YESTERDAY';
        document.getElementById('badge-active-scope').textContent = '📅 Date: Yesterday';
        document.getElementById('btn-toggle-scope').textContent = 'Switch to Today';
      } else {
        currentScope = 'TODAY';
        document.getElementById('badge-active-scope').textContent = '📅 Date: Today';
        document.getElementById('btn-toggle-scope').textContent = 'Switch to Yesterday';
      }
      timerSeconds = 30;
      runMasterSync();
    });

    document.getElementById('search-input').addEventListener('input', renderDashboard);
    document.getElementById('filter-status').addEventListener('change', renderDashboard);

    function startTimerLoop() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timerSeconds--;
        document.getElementById('timer-val').textContent = `${timerSeconds}s`;
        if (timerSeconds <= 0) {
          timerSeconds = 30;
          runMasterSync();
        }
      }, 1000);
    }

    // --- BOOTSTRAP ---
    window.addEventListener('load', () => {
      startTimerLoop();
      runMasterSync();
    });
  </script>
</body>
</html>
